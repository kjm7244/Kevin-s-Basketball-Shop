
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Kevin's Basketball Shop</title>

    <!-- Bootstrap CSS CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Your existing stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Kevin's Basketball Shop</h1>
        <p>Everything You Need for Your Game!</p>
    </header>

    <nav>
        <a href="storefront.html">Home</a>
        <a href="storefront.html#products">Products</a>
        <a href="signup.html">Sign Up / Login</a>
    </nav>

    <main class="container my-5">
        <section class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card shadow">
                    <div class="card-header text-center bg-dark text-white">
                        <h2 class="mb-0">Create an Account</h2>
                    </div>

                    <div class="card-body p-4">
                        <p class="text-center">
                            Sign up for Kevin's Basketball Shop!
                        </p>

                        <form action="#" method="post"
                              onsubmit="event.preventDefault(); alert('Signup form example submitted. No account was created.');">

                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       name="username"
                                       placeholder="Enter username"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="Enter email"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Enter password"
                                       minlength="8"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       name="confirmPassword"
                                       placeholder="Confirm password"
                                       minlength="8"
                                       required>
                            </div>

                            <button type="submit"
                                    class="btn btn-dark w-100">
                                Sign Up
                            </button>

                        </form>

                        <p class="text-center mt-3 mb-0">
                            Already have an account?
                            <a href="signup.html">Login</a>
                        </p>
                    </div>
                </div>

                <p class="text-center mt-3">
                    <a href="storefront.html">Return to the storefront</a>
                </p>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kevin's Basketball Shop. All rights reserved.</p>
    </footer>

</body>
</html>
